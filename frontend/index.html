<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="Reflow — Operational console for the bounded Razorpay failed-payment recovery pipeline (test mode)" />
  <link rel="icon" type="image/svg+xml" href="/reflow-favicon.svg?v=2" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <title>Reflow — Payment Recovery Console</title>
  <script>
    // Runs before first paint so a dark-theme user never sees a light
    // flash. Kept inline and dependency-free for that reason.
    (function () {
      try {
        var stored = localStorage.getItem("theme");
        var prefersDark =
          window.matchMedia &&
          window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme =
          stored === "light" || stored === "dark"
            ? stored
            : prefersDark
              ? "dark"
              : "light";
      } catch (e) {
        // Storage blocked (private mode) — fall back to light.
        document.documentElement.dataset.theme = "light";
      }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
